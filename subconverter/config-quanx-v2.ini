[custom]
; v2 QuanX 骨架：内网和中国大陆直连，其余流量使用默认节点。

ruleset=DIRECT,[]GEOIP,LAN
ruleset=DIRECT,[]GEOIP,CN
ruleset=默认节点,[]FINAL

custom_proxy_group=蜂窝`select`[]DIRECT`[]电信`[]移动
custom_proxy_group=WiFi`select`[]DIRECT`.*
custom_proxy_group=HOME-SH`select`[]DIRECT`[]电信`[]移动
custom_proxy_group=HOME-AQ`select`[]DIRECT`[]电信`[]移动
custom_proxy_group=电信`select`[]DIRECT`.*
custom_proxy_group=移动`select`[]DIRECT`.*

enable_rule_generator=true
overwrite_original_rules=true
